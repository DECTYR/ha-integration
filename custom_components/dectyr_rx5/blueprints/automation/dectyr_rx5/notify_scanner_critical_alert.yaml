blueprint:
  name: "Dectyr — Notify on scanner critical alert"
  description: >
    Sends a notification when a Dectyr scanner reports a critical alert
    (temperature, battery, MQTT, etc.).
  domain: automation
  source_url: https://github.com/dectyr/ha-integration/blob/main/custom_components/dectyr_rx5/blueprints/automation/dectyr_rx5/notify_scanner_critical_alert.yaml
  input:
    notify_target:
      name: Notification target
      selector:
        text:
trigger:
  - platform: event
    event_type: dectyr_rx5_scanner_alert
action:
  - service: !input notify_target
    data:
      title: "⚠ Dectyr scanner critical alert"
      message: >
        Scanner {{ trigger.event.data.scanner_id }}:
        {{ trigger.event.data.message }} (source: {{ trigger.event.data.source }})
mode: parallel
