blueprint:
  name: "Dectyr — Notify when a drone is detected in a zone"
  description: |
    Send a notification when a drone is detected inside a Home Assistant zone
    (useful for restricted areas, security perimeters, gardens, etc.).
  domain: automation
  source_url: https://github.com/alexandre0thomas/ha-dectyr/blob/main/custom_components/dectyr_rx5/blueprints/automation/dectyr_rx5/notify_drone_in_zone.yaml
  input:
    zone_to_watch:
      name: Zone to monitor
      selector:
        entity:
          domain: zone
    notify_target:
      name: Notification target
      description: notify service (e.g. notify.mobile_app_phone)
      selector:
        text:
trigger:
  - platform: event
    event_type: dectyr_rx5_drone_detected
condition:
  - condition: template
    value_template: >
      {% set z = states[zone_to_watch] %}
      {% set lat = trigger.event.data.latitude %}
      {% set lng = trigger.event.data.longitude %}
      {% if z and lat is not none and lng is not none
         and z.attributes.latitude is defined and z.attributes.longitude is defined
         and z.attributes.radius is defined %}
        {{ distance(lat, lng, z.attributes.latitude, z.attributes.longitude) * 1000
           <= z.attributes.radius }}
      {% else %}
        false
      {% endif %}
action:
  - service: !input notify_target
    data:
      title: "Drone detected in {{ states[zone_to_watch].name }}"
      message: >
        Drone {{ trigger.event.data.drone_id }}
        ({{ trigger.event.data.manufacturer | default('Unknown') }}
        {{ trigger.event.data.model | default('') }})
        detected at {{ trigger.event.data.latitude }}, {{ trigger.event.data.longitude }}
        by scanner {{ trigger.event.data.scanner_id }}.
mode: parallel
max: 50
