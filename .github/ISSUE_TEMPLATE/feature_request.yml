name: Feature request
description: Suggest an idea for the Dectyr RX5 integration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share your idea. Please check existing issues and discussions first.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem does this solve, or what workflow would it improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work in Home Assistant?
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues for duplicates.
          required: true
