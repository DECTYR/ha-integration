name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: custom_components/dectyr_rx5/frontend/package-lock.json
      - name: Build Lovelace card bundle
        working-directory: custom_components/dectyr_rx5/frontend
        run: npm ci && npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install homeassistant pytest-homeassistant-custom-component pytest-asyncio ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Pytest
        run: pytest tests/ -v
